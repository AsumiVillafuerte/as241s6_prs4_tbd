stages:
  - test
  - docker
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  DOCKER_IMAGE: "ms-product-sale"

cache:
  paths:
    - .m2/repository

test:
  stage: test
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - mvn -q test
  rules:
    - if: $CI_COMMIT_BRANCH

docker_publish:
  stage: docker
  image: docker:27.3.1
  services:
    - docker:27.3.1-dind
  script:
    - printf "%s" "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - docker build -t "$DOCKERHUB_USERNAME/$DOCKER_IMAGE:latest" .
    - docker push "$DOCKERHUB_USERNAME/$DOCKER_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

deploy_vps:
  stage: deploy
  image: curlimages/curl:8.10.1
  needs:
    - docker_publish
  script:
    - curl -fsS -X POST "$DEPLOY_WEBHOOK_URL"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop")'
    - if: "$CI_COMMIT_TAG"
