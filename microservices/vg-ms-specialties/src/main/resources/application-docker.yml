server:
  port: 8087
  compression:
    enabled: true
    min-response-size: 1024

spring:
  application:
    name: ms-specialties
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb+srv://snayder:Snayder123@cluster0.1jsaw0p.mongodb.net/specialties_db}
      auto-index-creation: true
  sql:
    init:
      mode: never

logging:
  level:
    root: WARN
    org.springframework.boot: WARN
    org.springframework.web: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized