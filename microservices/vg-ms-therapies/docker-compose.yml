version: '3.8'

services:
  ms-therapies:
    image: cardenastrujilloalonso/ms-therapies:latest
    container_name: ms-therapies
    ports:
      - "9094:9094"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATA_MONGODB_URI=${SPRING_DATA_MONGODB_URI:mongodb+srv://snayder:Snayder123@cluster0.1jsaw0p.mongodb.net/therapies_db}
      - SPRING_DATA_MONGODB_AUTO_INDEX_CREATION=true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped
