image: docker:cli

services:
  - docker:dind

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

stages:
  - docker_publish
  - deploy

docker_publish:
  stage: docker_publish
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
  
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  
  script:
    - docker build -t $DOCKERHUB_USERNAME/ms-consultation:latest -t $DOCKERHUB_USERNAME/ms-consultation:$CI_COMMIT_SHORT_SHA .
    - docker push $DOCKERHUB_USERNAME/ms-consultation:latest
    - docker push $DOCKERHUB_USERNAME/ms-consultation:$CI_COMMIT_SHORT_SHA

deploy_vps:
  stage: deploy
  image: curlimages/curl:8.10.1
  needs:
    - docker_publish
  script:
    - curl -fsS -X POST "$DEPLOY_WEBHOOK_URL"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop")'
    - if: "$CI_COMMIT_TAG"
