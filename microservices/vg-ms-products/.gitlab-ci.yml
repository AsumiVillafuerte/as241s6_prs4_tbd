stages:
  - test
  - docker
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  DOCKER_IMAGE: "ms-products"
  CONTAINER_NAME: "vg-ms-sigrc-products"
  COMPOSE_SERVICE: "vg-ms-sigrc-products"

cache:
  paths:
    - .m2/repository

test:
  stage: test
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - mvn -q test
  rules:
    - if: $CI_COMMIT_BRANCH

docker_publish:
  stage: docker
  image: docker:27.3.1
  services:
    - docker:27.3.1-dind
  script:
    - test -n "$DKH_USERNAME"
    - test -n "$DKH_TOKEN"
    - printf "%s" "$DKH_TOKEN" | docker login -u "$DKH_USERNAME" --password-stdin
    - docker build -t "$DKH_USERNAME/$DOCKER_IMAGE:latest" .
    - docker push "$DKH_USERNAME/$DOCKER_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

deploy_vps:
  stage: deploy
  image: curlimages/curl:8.10.1
  needs:
    - docker_publish
  script:
    - curl -fsS -X POST "$DEPLOY_WEBHOOK_URL"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop")'
    - if: "$CI_COMMIT_TAG"